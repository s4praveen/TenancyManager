# Azure Developer CLI: `azd up` provisions infra/ and deploys both services.
# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: tenancymanager
infra:
  provider: bicep
  path: infra
services:
  api:
    project: ./src/api/TenancyManager.Api
    language: dotnet
    host: containerapp
    docker:
      path: ../Dockerfile
      context: ../../..
      # Build the image in Azure Container Registry, so no local Docker is needed.
      remoteBuild: true
  web:
    project: ./src/web
    language: js
    host: staticwebapp
    dist: dist
    hooks:
      # Runs before azd builds the SPA; azd passes provision outputs (API_URL) and
      # `azd env set` values (ENTRA_*) as environment variables.
      prepackage:
        windows:
          shell: pwsh
          run: ../../scripts/azd/write-web-env.ps1
        posix:
          shell: sh
          run: ../../scripts/azd/write-web-env.sh
