# Azure Developer CLI: `azd up` provisions infra/ and deploys both services.
# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: tenancymanager
infra:
  provider: bicep
  path: infra
services:
  api:
    project: ./src/api/TenancyManager.Api
    language: dotnet
    host: containerapp
    docker:
      path: ../Dockerfile
      context: ../../..
  web:
    project: ./src/web
    language: js
    host: staticwebapp
    dist: dist
    hooks:
      prepackage:
        shell: sh
        # azd exposes provision outputs and azd env values (azd env set ...) as env vars here.
        run: >-
          npm ci &&
          VITE_AUTH_MODE=entra
          VITE_API_BASE_URL="$API_URL"
          VITE_ENTRA_TENANT_ID="$ENTRA_TENANT_ID"
          VITE_ENTRA_CLIENT_ID="$ENTRA_WEB_CLIENT_ID"
          VITE_ENTRA_API_SCOPE="api://$ENTRA_API_CLIENT_ID/access_as_user"
          npm run build
