name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  OPENSPEC_TELEMETRY: 0

jobs:
  specs:
    name: OpenSpec + traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: npx -y @fission-ai/openspec@2.1.1 validate --all --strict
      - run: node scripts/check-traceability.mjs --verbose

  api:
    name: API build + tests
    runs-on: ubuntu-latest
    env:
      REQUIRE_DOCKER: '1' # Postgres contract tests must run (not skip) in CI
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with: { global-json-file: global.json }
      - run: dotnet tool restore
      - run: dotnet build TenancyManager.slnx -c Release
      - run: dotnet test TenancyManager.slnx -c Release --no-build --logger "trx" --results-directory test-results
      - name: EF Core model matches migrations
        run: dotnet ef migrations has-pending-model-changes -p src/api/TenancyManager.Infrastructure -s src/api/TenancyManager.Api
      - name: OpenAPI document is up to date
        run: |
          dotnet build src/api/TenancyManager.Api -c Release -p:OpenApiGenerateDocumentsOnBuild=true
          git diff --exit-code -- src/api/TenancyManager.Api/openapi \
            || (echo "::error::openapi.json is stale. Run 'npm run api:generate' in src/web and commit." && exit 1)
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: api-test-results, path: test-results }

  web:
    name: Web build + tests
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: src/web }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm, cache-dependency-path: src/web/package-lock.json }
      - run: npm ci
      - name: Generated API client is up to date
        run: |
          npx orval --config orval.config.ts
          git diff --exit-code -- src/api/generated \
            || (echo "::error::Generated client is stale. Run 'npm run api:generate' and commit." && exit 1)
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with: { global-json-file: global.json }
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: npm ci
        working-directory: src/web
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: dotnet build src/api/TenancyManager.Api
      - run: npx playwright test
        working-directory: tests/e2e
        env: { CI: 'true' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: tests/e2e/playwright-report }
